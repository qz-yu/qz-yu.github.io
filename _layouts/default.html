<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    {% seo title=false %}
    {% include meta.html %}

    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#f3f5f8">
    <meta http-equiv="content-language" content="en-us">
    <meta name="google-site-verification" content="_dLzt_aq7qG4BRrG1MzbVvc40PNOmhtQNhfNHURbrPE">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
    {% include analytics_head.html %}
  </head>

  <body class="{{ page.body_class | default: 'site-page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="wide-container header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Qingzheng Yu, home">
          <span class="brand-mark" aria-hidden="true">QY</span>
          <span class="brand-copy">
            <strong>Qingzheng Yu</strong>
            <span>Astrophysicist</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active" aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} class="is-active" aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/gallery/' | relative_url }}"{% if page.url == '/gallery/' %} class="is-active" aria-current="page"{% endif %}>Gallery</a>
          <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} class="is-active" aria-current="page"{% endif %}>Contact</a>
          <a class="nav-cv" href="{{ site.cv_url | relative_url }}">CV <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wide-container footer-grid">
        <div class="footer-signoff">
          <span class="footer-mark" aria-hidden="true"></span>
          <p>{{ site.tagline }}</p>
          <small>© {{ site.time | date: '%Y' }} Qingzheng Yu</small>
        </div>
        <div class="footer-links" aria-label="Academic and social profiles">
          <a href="mailto:{{ site.footer-links.email }}">Email</a>
          <a href="{{ site.ads_url }}">ADS</a>
          <a href="{{ site.orcid_url }}">ORCID</a>
          <a href="{{ site.github_url }}">GitHub</a>
        </div>
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>

---
layout: default
---

<article class="page">
  <header class="page-hero">
    <div class="content-container">
      {% if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
    </div>
  </header>

  <div class="page-body content-container">
    {{ content }}
  </div>
</article>
